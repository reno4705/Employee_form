version: '3.9'
services:
  frontend: 
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
    - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=""
      - DB_NAME=employee_db